<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智答工作台</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/vendor/highlight-github.min.css">
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/vendor/highlight.min.js"></script>
    <script src="/static/vendor/cytoscape.min.js"></script>
    <script src="/static/js/common.js"></script>
</head>
<body data-page="chat" class="chat-workspace">
    <nav class="topnav"></nav>

    <div class="app-body chat-app-body">
        <aside class="chat-sidebar" id="sessionSidebar">
            <div class="sidebar-top">
                <div class="sidebar-title-row">
                    <span class="sidebar-title">会话</span>
                    <span class="panel-count" id="sessionCount">0</span>
                </div>
                <button class="icon-text-btn" id="newSessionBtn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
                    新建
                </button>
            </div>
            <div class="sidebar-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="sessionFilter" type="search" placeholder="搜索会话">
            </div>
            <div id="sessionList" class="chat-session-list"></div>
            <div class="sidebar-actions">
                <button class="btn" id="renameSessionBtn" type="button">重命名</button>
                <button class="btn" id="exportSessionBtn" type="button">导出</button>
                <button class="btn danger-ghost" id="clearSessionBtn" type="button">清空</button>
            </div>
        </aside>

        <main class="chat-main">
            <div class="chat-toolbar">
                <button class="icon-btn mobile-only" id="toggleSessionsBtn" type="button" title="会话列表">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <div class="chat-title-block">
                    <h1 id="currentSessionName">新会话</h1>
                    <span class="session-tag" id="currentSessionId"></span>
                </div>
                <div class="chat-toolbar-actions">
                    <button class="icon-text-btn" id="toggleReferencesBtn" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
                        引用
                        <span class="panel-count" id="refCount">0</span>
                    </button>
                    <button class="btn" id="exportBtn" type="button">导出</button>
                    <button class="btn danger-ghost" id="clearBtn" type="button">清空</button>
                </div>
            </div>

            <div id="messages" class="messages"></div>

            <div class="input-area">
                <div class="mode-switch" id="modeSwitch">
                    <button class="mode-btn active" type="button" data-mode="auto">自动</button>
                    <button class="mode-btn" type="button" data-mode="rag">仅知识库</button>
                    <button class="mode-btn" type="button" data-mode="chat">自由对话</button>
                </div>
                <div class="input-shell">
                    <textarea id="questionInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
                    <button class="send-btn" id="ticketBtn" type="button" title="将对话内容/故障描述生成结构化维修工单" style="width:auto;min-width:52px;padding:0 10px;margin-right:8px;font-size:13px;">工单</button>
                    <button class="send-btn" id="sendBtn" type="button" title="发送">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                    </button>
                </div>
                <div class="input-meta">
                    <span>回答按 Markdown 渲染，来源以 [来源N] 标注</span>
                    <span id="inputStatus"></span>
                </div>
            </div>
        </main>

        <aside class="references-panel" id="referencesPanel">
            <div class="ref-head">
                <div class="ref-tabs">
                    <button class="ref-tab active" id="refTabRefs" type="button">引用</button>
                    <button class="ref-tab" id="refTabKg" type="button">知识图谱</button>
                </div>
                <button class="icon-btn" id="closeReferencesBtn" type="button" title="收起">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="ref-body" id="refBody">
                <div class="empty-block">回答包含来源后会显示在这里</div>
            </div>
            <div class="ref-body hidden" id="kgBody">
                <div class="empty-block" id="kgStatus">知识图谱会在这里展示</div>
                <div id="kgCanvas"></div>
            </div>
        </aside>
    </div>

    <div class="modal-overlay hidden" id="renameModal">
        <div class="modal">
            <div class="modal-head">
                <span>重命名会话</span>
                <button class="icon-btn" id="closeRenameBtn" type="button" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <label class="field-label" for="sessionNameInput">会话名称</label>
                <input id="sessionNameInput" class="field-input" type="text" maxlength="200">
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelRenameBtn" type="button">取消</button>
                <button class="btn primary" id="confirmRenameBtn" type="button">保存</button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
